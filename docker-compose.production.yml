services:
  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to the image tag being deployed.}
    container_name: almaty-lis-polling-bot
    env_file:
      - .env
      - secrets.env
    environment:
      DATABASE__HOST: postgres
    volumes:
      - ./secrets.env:/app/secrets.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: almaty-lis-polling-bot-postgres
    env_file:
      - .env
      - secrets.env
    environment:
      POSTGRES_DB: ${DATABASE__NAME}
      POSTGRES_USER: ${DATABASE__USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in secrets.env.}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE__USERNAME} -d ${DATABASE__NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
