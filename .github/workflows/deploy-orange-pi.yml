name: Deploy to Orange Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: orange-pi-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test AlmatyLISPollingBot.sln -c Release

  deploy:
    name: Build and deploy ARM64 image
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: almaty-lis-polling-bot:${{ github.sha }}
      DEPLOY_PATH: ${{ secrets.ORANGE_PI_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 Docker image
        run: docker buildx build --platform linux/arm64 --tag "$IMAGE_TAG" --output type=docker,dest=image.tar .
      - name: Create deployment bundle
        run: |
          mkdir deployment
          mv image.tar deployment/image.tar
          cp docker-compose.production.yml deployment/
          tar -cf deployment.tar deployment
      - name: Prepare Orange Pi directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORANGE_PI_HOST }}
          port: ${{ secrets.ORANGE_PI_PORT }}
          username: ${{ secrets.ORANGE_PI_USERNAME }}
          key: ${{ secrets.ORANGE_PI_SSH_PRIVATE_KEY }}
          script: mkdir -p "${{ secrets.ORANGE_PI_DEPLOY_PATH }}/incoming"
      - name: Upload deployment bundle
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ORANGE_PI_HOST }}
          port: ${{ secrets.ORANGE_PI_PORT }}
          username: ${{ secrets.ORANGE_PI_USERNAME }}
          key: ${{ secrets.ORANGE_PI_SSH_PRIVATE_KEY }}
          source: deployment.tar
          target: ${{ secrets.ORANGE_PI_DEPLOY_PATH }}/incoming
      - name: Load image and restart the bot
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_PATH: ${{ secrets.ORANGE_PI_DEPLOY_PATH }}
        with:
          host: ${{ secrets.ORANGE_PI_HOST }}
          port: ${{ secrets.ORANGE_PI_PORT }}
          username: ${{ secrets.ORANGE_PI_USERNAME }}
          key: ${{ secrets.ORANGE_PI_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env
            test -f secrets.env
            if docker container inspect almaty-lis-polling-bot >/dev/null 2>&1; then
              docker image tag "$(docker inspect --format '{{.Image}}' almaty-lis-polling-bot)" almaty-lis-polling-bot:previous
            fi
            tar -xf incoming/deployment.tar
            docker load -i deployment/image.tar
            mv deployment/docker-compose.production.yml .
            rm -rf deployment incoming/deployment.tar
            BOT_IMAGE="$IMAGE_TAG" docker compose -f docker-compose.production.yml up -d --remove-orphans
            sleep 10
            docker compose -f docker-compose.production.yml ps
            docker compose -f docker-compose.production.yml ps --status running --services | grep -qx bot
            docker image prune -f
